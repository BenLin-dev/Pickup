      colour reference; Inter carries the body copy.

      Both are self-hosted from `/fonts/` — see `src/assets/styles/fonts.css`.
      They used to come from `fonts.googleapis.com`, a third-party origin that
      is unreachable from mainland China: the render-blocking stylesheet link
      stalled first paint until the request timed out.

      `crossorigin` is required on font preloads even same-origin, because
      fonts are always fetched in CORS mode; without it the browser downloads
      the file twice and throws the preload away.
